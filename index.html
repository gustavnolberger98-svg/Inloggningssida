<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Svampletarna</h1>
        </header>
<main>
    <form action="#" method="get">
        <p>
            <label for="namn">Namn:</label>
            <input type="text" id="name" placeholder="Namn" name="namn">
        </p>
        <p>
            <label for="password">Lösenord:</label>
            <input type="password" id="password" placeholder="Lösenord" name="password">
        </p>
        <p>
            <input type="submit" value="Logga in">
        </p>
    </form>
    </div>

    <div class="bild">
        <img src="svampar.jpg" alt="bild på svampar">
    </div>
    <p class="message" id="meddelande"></p>
</main>
</body>
</html>
